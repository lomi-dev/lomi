name: Qualify selected npm archives

on:
  workflow_dispatch:
    inputs:
      qualify_registry:
        description: Verify published registry versions and fresh consumers
        type: boolean
        default: false
  workflow_call:
    inputs:
      qualify_registry:
        type: boolean
        default: false
    secrets:
      CANONICAL_SOURCE_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  archives:
    name: npm archives (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    steps:
      - name: Preserve exact source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: host
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: consumer-host
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        if: inputs.qualify_registry
        with:
          ref: ${{ github.sha }}
          path: registry-host
          persist-credentials: false
      - name: Set up pinned canonical sources for host checkouts
        uses: ./host/.github/actions/setup-canonical-sources
        with:
          desktop-relative-path: host
          remote-repository: ${{ vars.LOMI_REMOTE_CORE_REPOSITORY }}
          remote-sha: ${{ vars.LOMI_REMOTE_CORE_SHA }}
          remote-web-sha: ${{ vars.REMOTE_WEB_SHA }}
          checkout-token: ${{ secrets.CANONICAL_SOURCE_TOKEN || github.token }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          repository: lomi-dev/plugin-sdk
          ref: bf7bb28fd9e9940b799f2e89791dfea869891f9d
          path: plugin-sdk
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          repository: lomi-dev/plugin-tools
          ref: 00619154bcef985e14e072714be213fc099a50dd
          path: plugin-tools
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          repository: lomi-dev/create-lomi-plugin
          ref: ee12d7967fc09472968c7cec725916ead5d41282
          path: create-lomi-plugin
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4
        with:
          version: 11.25.0
          package_json_file: host/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: 22.22.3
      - name: Qualify immutable candidates and clean host consumers
        working-directory: host
        env:
          LOMI_HOST_COMMIT: ${{ github.sha }}
        run: pnpm test:npm-archives
      - name: Verify registry archives and fresh registry consumers
        if: inputs.qualify_registry
        working-directory: host
        env:
          LOMI_HOST_COMMIT: ${{ github.sha }}
        run: pnpm test:npm-registry
      - name: Retain qualification reports and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: npm-qualification-${{ matrix.platform }}
          path: host/test-results/npm-qualification
          if-no-files-found: error
          retention-days: 90
