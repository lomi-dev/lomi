name: "Prepare signed draft"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Intel Mac
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux
            target: ""
            args: ""
          - platform: "windows-latest" # Windows
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned canonical shared sources
        uses: ./.github/actions/setup-canonical-sources
        with:
          desktop-relative-path: .
          remote-repository: ${{ vars.LOMI_REMOTE_CORE_REPOSITORY }}
          remote-sha: ${{ vars.LOMI_REMOTE_CORE_SHA }}
          remote-web-sha: ${{ vars.REMOTE_WEB_SHA }}
          checkout-token: ${{ secrets.CANONICAL_SOURCE_TOKEN || github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: select Xcode 26 for Icon Composer (macOS only)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: verify the release version and license
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: read release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const path = `releases/${process.env.RELEASE_TAG}.md`;
          const body = existsSync(path) ? readFileSync(path, 'utf8') : 'See the assets to download this version.';
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`);
          JS

      - name: require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing."; exit 1; }

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked

      - name: verify AppImage backend selection before publishing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#images[@]}" -ne 1 ]; then
            echo "Expected exactly one AppImage for backend qualification." >&2
            exit 1
          fi
          image="$PWD/${images[0]}"
          scratch=$(mktemp -d "$RUNNER_TEMP/lomi-appimage-backend.XXXXXX")
          trap 'rm -rf "$scratch"' EXIT
          chmod +x "$image"
          (cd "$scratch" && "$image" --appimage-extract > /dev/null)
          node scripts/qualify-appimage-backend.mjs "$scratch/squashfs-root"

      - name: notarize and verify macOS disk images before publishing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          DMG_DIRECTORY: src-tauri/target/${{ matrix.target }}/release/bundle/dmg
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=("$DMG_DIRECTORY"/*.dmg)
          if [ "${#dmgs[@]}" -eq 0 ]; then
            echo "No macOS disk images found for notarization." >&2
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            receipt=$(mktemp "$RUNNER_TEMP/lomi-dmg-notary.XXXXXX")
            xcrun notarytool submit "$dmg" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait --output-format json > "$receipt"
            if ! jq -e '.status == "Accepted"' "$receipt" > /dev/null; then
              echo "Apple did not accept the disk image for notarization." >&2
              exit 1
            fi
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            codesign --verify --strict --verbose=4 "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
            gh release upload "$RELEASE_TAG" "$dmg" --clobber
            rm -f "$receipt"
          done
