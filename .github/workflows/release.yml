name: "publish"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Intel Mac
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux
            target: ""
            args: ""
          - platform: "windows-latest" # Windows
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: select Xcode 26 for Icon Composer (macOS only)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: verify the release version and license
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: read release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const path = `releases/${process.env.RELEASE_TAG}.md`;
          const body = existsSync(path) ? readFileSync(path, 'utf8') : 'See the assets to download this version.';
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`);
          JS

      - name: require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing."; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: verify updater metadata and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          node scripts/check-updater.mjs "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest

  # Keep AUR publishing separately runnable, so a temporary AUR outage can be
  # retried without rebuilding every Tauri bundle.
  publish-aur:
    needs: publish-release
    uses: ./.github/workflows/publish-aur.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  # The first Flathub submission is reviewed manually. Once its dedicated
  # repository exists and FLATHUB_TOKEN is configured, every successful release
  # asks that repository's maintenance workflow to prepare an update PR.
  notify-flathub:
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - name: Flathub is not connected yet
        if: env.FLATHUB_TOKEN == ''
        run: echo "Skipping Flathub notification until FLATHUB_TOKEN is configured."

      - name: Trigger the Flathub update workflow
        if: env.FLATHUB_TOKEN != ''
        # peter-evans/repository-dispatch v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ env.FLATHUB_TOKEN }}
          repository: flathub/dev.lomi.desktop
          event-type: lomi-release
          client-payload: '{"tag":"${{ github.ref_name }}","commit":"${{ github.sha }}"}'
