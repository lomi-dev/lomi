name: "publish"

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon
            target: "aarch64-apple-darwin"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-15-intel" # Intel Mac
            target: "x86_64-apple-darwin"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux
            target: ""
            args: ""
          - platform: "windows-latest" # Windows
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: select Xcode 26 for Icon Composer (macOS only)
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: verify the release version and license
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs "$RELEASE_TAG"

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: read release notes
        id: notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, appendFileSync } from 'node:fs';
          import { randomUUID } from 'node:crypto';
          const path = `releases/${process.env.RELEASE_TAG}.md`;
          const body = existsSync(path) ? readFileSync(path, 'utf8') : 'See the assets to download this version.';
          const delimiter = randomUUID();
          appendFileSync(process.env.GITHUB_OUTPUT, `body<<${delimiter}\n${body}\n${delimiter}\n`);
          JS

      - name: require the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Configure TAURI_SIGNING_PRIVATE_KEY before publishing."; exit 1; }

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: pnpm tauri
          tagName: v__VERSION__
          releaseName: "v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} -- --locked

  publish-release:
    needs: publish-tauri
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: verify updater metadata and publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP/updater"
          node scripts/check-updater.mjs "$RELEASE_TAG" "$RUNNER_TEMP/updater/latest.json"
          gh release edit "$RELEASE_TAG" --draft=false --latest

  publish-aur:
    name: Publish ${{ matrix.package }} to AUR
    needs: publish-release
    permissions:
      contents: read
    concurrency:
      group: publish-aur-${{ matrix.package }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: lomi-bin
            pkgbuild: ./aur/lomi-bin/PKGBUILD
            source_kind: deb
          - package: lomi
            pkgbuild: ./aur/lomi/PKGBUILD
            source_kind: source
    env:
      AUR_MAINTAINER_NAME: "Woro"
      AUR_MAINTAINER_EMAIL: "woro@tanieddosy.pl"

    steps:
      - name: Validate the release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a version tag such as v0.1.0; got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the released source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify the tagged source and published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-release.mjs "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease | jq -e '.isDraft == false and .isPrerelease == false'
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$RELEASE_TAG"

      - name: Prepare ${{ matrix.package }}
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SOURCE_KIND: ${{ matrix.source_kind }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          if [[ "$SOURCE_KIND" == "deb" ]]; then
            url="https://github.com/lomi-dev/lomi/releases/download/v${VERSION}/Lomi_${VERSION}_amd64.deb"
            archive="$RUNNER_TEMP/Lomi_${VERSION}_amd64.deb"
            checksum_key=sha256sums_x86_64
          else
            url="https://github.com/lomi-dev/lomi/archive/refs/tags/v${VERSION}.tar.gz"
            archive="$RUNNER_TEMP/lomi-${VERSION}.tar.gz"
            checksum_key=sha256sums
          fi

          curl --fail --location --retry 4 --retry-all-errors --output "$archive" "$url"
          checksum=$(sha256sum "$archive" | cut -d' ' -f1)
          [[ "$checksum" =~ ^[0-9a-f]{64}$ ]]

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "aur/${PACKAGE}/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "aur/${PACKAGE}/PKGBUILD"
          sed -i "s/^${checksum_key}=.*/${checksum_key}=('${checksum}')/" "aur/${PACKAGE}/PKGBUILD"
          bash -n "aur/${PACKAGE}/PKGBUILD"

      # AUR maintenance windows should not make an entire release permanently
      # stale. Retry here before rerunning a failed job from this release.
      - name: Publish to AUR (attempt 1)
        id: publish_1
        continue-on-error: true
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |
            build(aur): publish ${{ github.ref_name }}

            Update the package from the verified stable GitHub release.

            Validation:
            - Tagged versions and license: verified
            - SHA-256 source checksum: calculated before publication
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Wait before retry 2
        if: steps.publish_1.outcome == 'failure'
        run: sleep 30

      - name: Publish to AUR (attempt 2)
        id: publish_2
        if: steps.publish_1.outcome == 'failure'
        continue-on-error: true
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |
            build(aur): publish ${{ github.ref_name }}

            Update the package from the verified stable GitHub release.

            Validation:
            - Tagged versions and license: verified
            - SHA-256 source checksum: calculated before publication
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Wait before retry 3
        if: steps.publish_1.outcome == 'failure' && steps.publish_2.outcome == 'failure'
        run: sleep 60

      - name: Publish to AUR (attempt 3)
        if: steps.publish_1.outcome == 'failure' && steps.publish_2.outcome == 'failure'
        # KSXGitHub/github-actions-deploy-aur v4.2.0
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: ${{ matrix.pkgbuild }}
          commit_username: ${{ env.AUR_MAINTAINER_NAME }}
          commit_email: ${{ env.AUR_MAINTAINER_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: |
            build(aur): publish ${{ github.ref_name }}

            Update the package from the verified stable GitHub release.

            Validation:
            - Tagged versions and license: verified
            - SHA-256 source checksum: calculated before publication
          ssh_keyscan_types: rsa,ecdsa,ed25519

  # The first Flathub submission is reviewed manually. Once its dedicated
  # repository exists and FLATHUB_TOKEN is configured, every successful release
  # asks that repository's maintenance workflow to prepare an update PR.
  notify-flathub:
    needs: publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
    steps:
      - name: Flathub is not connected yet
        if: env.FLATHUB_TOKEN == ''
        run: echo "Skipping Flathub notification until FLATHUB_TOKEN is configured."

      - name: Trigger the Flathub update workflow
        if: env.FLATHUB_TOKEN != ''
        # peter-evans/repository-dispatch v4.0.1
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697
        with:
          token: ${{ env.FLATHUB_TOKEN }}
          repository: flathub/dev.lomi.desktop
          event-type: lomi-release
          client-payload: '{"tag":"${{ github.ref_name }}","commit":"${{ github.sha }}"}'
