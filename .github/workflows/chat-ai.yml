name: Chat AI cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/custom-api-*"
    paths:
      - ".github/workflows/chat-ai.yml"
      - "src/**"
      - "src-tauri/**"
      - "packages/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - ".github/workflows/chat-ai.yml"
      - "src/chat/**"
      - "src-tauri/src/chat/**"
      - "packages/ai-runtime/**"
      - "tests/ui/chat-settings.spec.ts"
      - "tests/ui/chat-mock.ts"
      - "pnpm-lock.yaml"
      - "src-tauri/Cargo.lock"

permissions:
  contents: read

concurrency:
  group: chat-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chat-ai:
    name: Chat AI (${{ matrix.platform }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            browser: chromium
            config: playwright.config.ts
          - platform: windows-latest
            browser: chromium
            config: playwright.config.ts
          - platform: macos-latest
            browser: webkit
            config: playwright.webkit.config.ts
          - platform: macos-15-intel
            browser: webkit
            config: playwright.webkit.config.ts
    runs-on: ${{ matrix.platform }}
    env:
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend and check types
        run: pnpm build
      - name: Test all API formats and runtime transport
        run: pnpm ai:test
      - name: Install browser engine
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Test provider settings and Custom API
        run: pnpm exec playwright test tests/ui/chat-settings.spec.ts --config=${{ matrix.config }} --workers=2
      - name: Test native Chat AI storage and dispatch
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib chat:: -- --test-threads=1
      - name: Test native notification migration
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --locked --lib notifications:: -- --test-threads=1
