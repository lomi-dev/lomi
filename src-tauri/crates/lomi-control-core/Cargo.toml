[package]
name = "lomi-control-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
remote-host = ["dep:lomi-native-git", "dep:lomi-remote-protocol"]

[dependencies]
ring = "0.17.14"
lomi-control-protocol = { path = "../lomi-control-protocol" }
lomi-native-project-files = { path = "../../../../lomi-remote/crates/lomi-native-project-files" }
lomi-native-git = { path = "../../../../lomi-remote/crates/lomi-native-git", optional = true }
lomi-remote-protocol = { path = "../../../../lomi-remote/crates/lomi-remote-protocol", optional = true }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["io-util", "net", "sync", "time", "rt", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
sha2 = "0.10"
base64 = "=0.22.1"
libc = "0.2"
tempfile = "3"
url = "2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
