[package]
name = "lomi-remote-crypto-desktop"
version = "0.1.0"
edition = "2021"
publish = false
[lib]
name = "lomi_remote_crypto"
crate-type = ["rlib", "cdylib"]
[features]
test-fixtures = []
browser = ["dep:wasm-bindgen"]
[dependencies]
snow = { path = "../../../../lomi-remote/crates/lomi-remote-crypto/vendor/snow", version = "=0.10.0", default-features = false, features = ["default-resolver", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
hpke = { version = "=0.14.1", default-features = false, features = ["alloc", "x25519", "chacha", "getrandom"] }
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
sha2 = "=0.10.9"
zeroize = "=1.8.2"
minicbor = { version = "=0.26.5", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom04 = { package = "getrandom", version = "=0.4.3" }
wasm-bindgen = { version = "=0.2.126", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "=0.4.3", features = ["wasm_js"] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
snow = { path = "../../../../lomi-remote/crates/lomi-remote-crypto/vendor/snow", version = "=0.10.0", default-features = false, features = ["std"] }
