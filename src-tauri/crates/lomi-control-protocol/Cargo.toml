[package]
name = "lomi-control-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
schemars = "=1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time"] }
url = "=2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
