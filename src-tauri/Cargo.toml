[package]
name = "lomi"
version = "0.6.1"
license = "Apache-2.0"
description = "A workspace for terminal-driven development"
authors = ["Maciej Kolerski <woro@tanieddosy.pl>"]
repository = "https://github.com/lomi-dev/lomi"
edition = "2021"
publish = false

[workspace]
members = [".", "crates/lomi-control-protocol", "crates/lomi-control-core", "crates/lomi-mcp"]
default-members = ["."]
resolver = "2"
exclude = ["vendor/glib", "vendor/tao"]

[patch.crates-io]
# GTK 0.18 requires glib 0.18; retain the compatible upstream security backport.
glib = { path = "vendor/glib" }
# Preserve AppKit exception propagation through the native event callbacks.
tao = { path = "vendor/tao" }
# Share the canonical host's terminal grid and parser sources.
alacritty_terminal = { path = "../../lomi-remote/vendor/alacritty_terminal" }
vte = { path = "../../lomi-remote/vendor/vte" }

[lib]
# A distinct library name avoids a Windows artifact name collision with the binary.
name = "lomi_lib"

[profile.dev]
# Retain backtrace locations without large debug and incremental artifacts.
debug = "line-tables-only"
incremental = false

[features]
experimental-macos-coalition-cleanup = ["lomi-terminal/experimental-macos-coalition-cleanup"]

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0" }
tauri-build = { version = "2", features = [] }
tonic-prost-build = { version = "0.14.6" }
lomi-remote-protocol = { path = "../../lomi-remote/crates/lomi-remote-protocol" }

[dependencies]
lomi-remote-crypto-canonical = { package = "lomi-remote-crypto", path = "../../lomi-remote/crates/lomi-remote-crypto" }
zeroize = { version = "=1.8.2", features = ["serde"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
lomi-mcp = { path = "crates/lomi-mcp" }
lomi-control-core = { path = "crates/lomi-control-core" }
lomi-control-protocol = { path = "crates/lomi-control-protocol" }
lomi-host = { path = "../../lomi-remote/crates/lomi-host" }
lomi-git = { path = "../../lomi-remote/crates/lomi-git" }
lomi-files = { path = "../../lomi-remote/crates/lomi-files" }
lomi-native-files = { path = "../../lomi-remote/crates/lomi-native-files" }
lomi-native-project-files = { path = "../../lomi-remote/crates/lomi-native-project-files" }
lomi-platform = { path = "../../lomi-remote/crates/lomi-platform" }
lomi-remote-protocol = { path = "../../lomi-remote/crates/lomi-remote-protocol" }
lomi-terminal = { path = "../../lomi-remote/crates/lomi-terminal" }
tauri = { version = "2", features = ["macos-private-api", "unstable", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
anyhow = "=1.0.104"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
futures-util = "=0.3.34"
quick-xml = "0.41"
percent-encoding = "2"
sha2 = "0.10"
notify = "8.2"
tempfile = "3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "tga", "dds", "pnm", "qoi", "hdr", "exr", "ff", "gif", "bmp", "ico"] }
regex = "1"
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
trash = "5"
toml_edit = "0.25"
tauri-plugin-updater = "~2.11"
tauri-plugin-fs = { version = "2", features = ["watch"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
plist = "1.8"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = { version = "0.14.6" }
prost = { version = "0.14.4" }
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs", "net"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
ring = { version = "0.17.14" }
base64 = { version = "0.22.1" }

tar = { version = "0.4.46" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize", "serialize"] }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "=2.4.2"
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.103"
web-sys = "=0.3.103"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
webview2-com = { version = "=0.38.2" }
windows = { version = "=0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_RemoteDesktop", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
security-framework = "=3.7.0"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSView", "NSButton", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSURL", "NSError", "NSValue", "NSProcessInfo", "NSUUID", "NSURLRequest"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKNavigation", "WKContentWorld", "WKUserScript", "WKUserContentController", "WKFrameInfo", "WKUIDelegate", "WKOpenPanelParameters", "WKSecurityOrigin", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }
block2 = { version = "=0.6.2" }
