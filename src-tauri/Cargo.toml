[package]
name = "lomi"
version = "0.4.0"
license = "Apache-2.0"
description = "A workspace for terminal-driven development"
authors = ["Maciej Kolerski <woro@tanieddosy.pl>"]
repository = "https://github.com/lomi-dev/lomi"
edition = "2021"
publish = false

[workspace]
members = [".", "crates/lomi-control-protocol", "crates/lomi-control-core", "crates/lomi-mcp"]
default-members = ["."]
resolver = "2"

[lib]
# A distinct library name avoids a Windows artifact name collision with the binary.
name = "lomi_lib"

[profile.dev]
# Retain backtrace locations without large debug and incremental artifacts.
debug = "line-tables-only"
incremental = false

[features]
native-smoke = []
chat-probe = ["native-smoke"]
android-probe = ["native-smoke", "dep:turbojpeg", "objc2/exception"]
mcp-probe = ["objc2-app-kit/NSGraphicsContext"]

[[example]]
name = "macos-traffic-lights"
path = "../tests/native/macos-traffic-lights.rs"

[build-dependencies]
protoc-bin-vendored = { version = "3.2.0" }
tauri-build = { version = "2", features = [] }
tonic-prost-build = { version = "0.14.6" }

[dependencies]
lomi-control-core = { path = "crates/lomi-control-core" }
lomi-control-protocol = { path = "crates/lomi-control-protocol" }
tauri = { version = "2", features = ["macos-private-api", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
quick-xml = "0.41"
percent-encoding = "2"
sha2 = "0.10"
notify = "8.2"
tempfile = "3"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "tga", "dds", "pnm", "qoi", "hdr", "exr", "ff", "gif", "bmp", "ico"] }
regex = "1"
libc = "0.2"
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
trash = "5"
toml_edit = "0.25"
tauri-plugin-updater = "~2.11"
tauri-plugin-fs = { version = "2", features = ["watch"] }
jsonc-parser = { version = "0.33.1", features = ["serde"] }
plist = "1.8"
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tonic = { version = "0.14.6", default-features = false, features = ["channel", "codegen"] }
tonic-prost = { version = "0.14.6" }
prost = { version = "0.14.4" }
tokio = { version = "1", features = ["time", "sync", "macros", "process", "io-util", "fs"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
turbojpeg = { version = "1.5.1", default-features = false, features = ["cmake", "require-simd"], optional = true }
ring = { version = "0.17.14" }
base64 = { version = "0.22.1" }

tar = { version = "0.4.46" }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
gtk = "0.18"
webkit2gtk = "2"

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSView", "NSButton", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSURL", "NSError", "NSValue", "NSProcessInfo", "NSUUID", "NSURLRequest"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "WKNavigation", "WKContentWorld", "WKUserScript", "WKUserContentController", "WKFrameInfo", "WKUIDelegate", "WKOpenPanelParameters", "WKSecurityOrigin", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }
block2 = { version = "=0.6.2" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSBitmapImageRep", "NSImageRep"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSString"] }
